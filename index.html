const WEEK_LABELS={A:"Noční",B:"Odpolední",C:"Ranní",V:"Volno"};

function t2m(t){if(!t)return 0;const[h,m]=t.split(":").map(Number);return h*60+m}
function m2t(m){let x=Math.floor(m)%1440;if(x<0)x+=1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function div(cls,txt){return el("div",cls,txt)}
function btn(cls,txt,onClick){const b=el("button",cls,txt);if(onClick)b.addEventListener("click",onClick);return b}
function signedMin(n){return n>0?`+${n} min`:n<0?`${n} min`:"0 min"}

let FALLBACK_READY=false;
const STORE=(()=>{
  const memory={};
  try{const k="nos_test";localStorage.setItem(k,"1");localStorage.removeItem(k);
    return{persistent:true,getItem:k=>localStorage.getItem(k),setItem:(k,v)=>localStorage.setItem(k,v),removeItem:k=>localStorage.removeItem(k)};
  }catch(e){
    return{persistent:false,
      getItem:k=>Object.prototype.hasOwnProperty.call(memory,k)?memory[k]:null,
      setItem:(k,v)=>{memory[k]=String(v);if(FALLBACK_READY)persistFallback(k,String(v));},
      removeItem:k=>{delete memory[k];}};
  }
})();
function loadJson(key,fallback){try{const r=STORE.getItem(key);return r?JSON.parse(r):fallback}catch{return fallback}}
function openFallbackDB(){return new Promise((res,rej)=>{if(!("indexedDB"in window)){rej(new Error("no idb"));return}const r=indexedDB.open("nutri_os_store",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function readFallback(key){const db=await openFallbackDB();return new Promise(r=>{const t=db.transaction("kv","readonly"),q=t.objectStore("kv").get(key);q.onsuccess=()=>r(q.result??null);q.onerror=()=>r(null)})}
async function persistFallback(key,value){try{const db=await openFallbackDB();const t=db.transaction("kv","readwrite");t.objectStore("kv").put(value,key)}catch(e){}}
async function hydrateFallbackState(){
  if(STORE.persistent)return;
  try{
    const keys=["nos_week","nos_active_week","nos_theme","nos_logs","nos_skips","nos_fswaps","nos_last_cycle"];
    const vals=await Promise.all(keys.map(k=>readFallback(k)));
    vals.forEach((v,i)=>{if(v!=null)STORE.setItem(keys[i],v)});
    S.week=STORE.getItem("nos_week")||S.week;
    S.activeWeek=STORE.getItem("nos_active_week")||S.activeWeek;
    S.theme=THEMES.find(t=>t.id===STORE.getItem("nos_theme"))||S.theme;
    S.logs=loadJson("nos_logs",S.logs);S.skips=loadJson("nos_skips",S.skips);S.foodSwaps=loadJson("nos_fswaps",S.foodSwaps);
  }catch(e){}
  FALLBACK_READY=true;render();
}

const S={
  week:STORE.getItem("nos_week")||"A",
  activeWeek:STORE.getItem("nos_active_week")||STORE.getItem("nos_week")||"A",
  theme:THEMES.find(t=>t.id===STORE.getItem("nos_theme"))||THEMES[0],
  intensity:parseFloat(STORE.getItem("nos_intensity")||"0.18"),
  tab:"now",
  logs:loadJson("nos_logs",{}),skips:loadJson("nos_skips",{}),foodSwaps:loadJson("nos_fswaps",{}),
  myColors:loadJson("nos_mycolors",{}),myColorsMode:STORE.getItem("nos_mycolors_mode")==="1",
  manualTime:null,expandedWhy:{},modal:null,now:new Date(),autoScroll:true,_dayView:"dnes",_nowView:"dnes"
};

(function(){
  const sched=WEEKS[S.activeWeek].schedule;if(!sched.length)return;
  const resetTimeStr=WEEKS[S.activeWeek].resetTime||sched[0].timeStart||sched[0].time||"00:00";
  const cycleStartMin=t2m(resetTimeStr),now=new Date(),nowMin=now.getHours()*60+now.getMinutes(),cd=new Date(now);
  if(nowMin<cycleStartMin)cd.setDate(cd.getDate()-1);

  // Speciální případ: Noční (A) v pátek → přepni na Volno ve 20:00
  const dow=now.getDay(); // 0=Ne,1=Po,...,5=Pá,6=So
  const isFridayNoční=(dow===5 && S.activeWeek==="A" && nowMin>=t2m("20:00"));
  
  // Pro Volno přepnutí použijeme speciální cycleKey
  const cycleKey=isFridayNoční
    ? cd.toISOString().slice(0,10)+"_VOLNO_PATEK"
    : cd.toISOString().slice(0,10)+"_"+sched[0].id;

  if(STORE.getItem("nos_last_cycle")!==cycleKey){
    const backupData=JSON.stringify({logs:S.logs,skips:S.skips,foodSwaps:S.foodSwaps});
    const hasData=Object.keys(S.logs).length>0||Object.keys(S.skips).length>0;
    const todayStr=cd.toISOString().slice(0,10);
    // Backup jen pokud ještě nebyl uložen pro tento datum a tuto směnu
    const alreadyBacked=STORE.getItem("nos_yesterday_date")===todayStr && STORE.getItem("nos_yesterday_week")===S.activeWeek;
    if(hasData && !alreadyBacked){
      STORE.setItem("nos_yesterday_data",backupData);
      STORE.setItem("nos_yesterday_week",S.activeWeek);
      STORE.setItem("nos_yesterday_date",todayStr);
      try{fetch(CLOUD_WEBHOOK,{method:"POST",body:JSON.stringify({typ:"data",data:backupData}),mode:"no-cors"}).catch(()=>{})}catch(e){}
    }

    if(isFridayNoční){
      // Pátek 20:00 → přepni Noční na Volno, označ že cyklus začíná od 20:00
      STORE.setItem("nos_pre_volno_shift","A");
      STORE.setItem("nos_volno_patek","1"); // flag: tento cyklus Volna začal v pátek ve 20:00
      S.activeWeek="V"; S.week="V";
      STORE.setItem("nos_active_week","V"); STORE.setItem("nos_week","V");
    } else {
      STORE.removeItem("nos_volno_patek"); // normální cyklus Volna — flag smaž
      // Standardní 00:00 reset
      const newCycleDate=new Date(cd);newCycleDate.setDate(newCycleDate.getDate()+1);
      const dow2=newCycleDate.getDay();
      const cur=S.activeWeek;

      // Pátek 00:00 → Volno (pro B a C)
      if(dow2===5 && ["B","C"].includes(cur)){
        STORE.setItem("nos_pre_volno_shift",cur);
        S.activeWeek="V"; S.week="V";
        STORE.setItem("nos_active_week","V"); STORE.setItem("nos_week","V");
      }
      // Pondělí 00:00 → z Volna (po B)
      else if(dow2===1 && cur==="V"){
        const pre=STORE.getItem("nos_pre_volno_shift")||"B";
        if(pre!=="C"){
          const seq=["A","B","C"],idx=seq.indexOf(pre);
          const next=seq[(idx+1)%3];
          S.activeWeek=next; S.week=next;
          STORE.setItem("nos_active_week",next); STORE.setItem("nos_week",next);
        }
      }
      // Neděle 00:00 → Noční (po Ranní C)
      else if(dow2===0 && cur==="V"){
        const pre=STORE.getItem("nos_pre_volno_shift")||"";
        if(pre==="C"){
          S.activeWeek="A"; S.week="A";
          STORE.setItem("nos_active_week","A"); STORE.setItem("nos_week","A");
        }
      }
      // Ostatní dny → kotva rotace A→B→C
      else if(["A","B","C"].includes(cur)){
        const ts=STORE.getItem("nos_anchor_ts"),sh=STORE.getItem("nos_anchor_shift");
        if(ts&&sh){
          const m2=new Date(active);m2.setHours(0,0,0,0);const d2=m2.getDay()||7;m2.setDate(m2.getDate()-d2+1);
          const diffW=Math.round((m2.getTime()-parseInt(ts))/(1000*60*60*24*7));
          const seq=["A","B","C"],idx=seq.indexOf(sh);
          if(idx>-1){let nI=(idx+diffW)%3;if(nI<0)nI+=3;const cs=seq[nI];
            if(S.activeWeek!==cs){const old=S.activeWeek;S.activeWeek=cs;STORE.setItem("nos_active_week",cs);if(S.week===old){S.week=cs;STORE.setItem("nos_week",cs);}}}
        }
      }
    }

    S.logs={};S.skips={};S.foodSwaps={};
    STORE.setItem("nos_logs","{}");STORE.setItem("nos_skips","{}");STORE.setItem("nos_fswaps","{}");
  }
  STORE.setItem("nos_last_cycle",cycleKey);
})();

function save(){
  STORE.setItem("nos_logs",JSON.stringify(S.logs));STORE.setItem("nos_skips",JSON.stringify(S.skips));STORE.setItem("nos_fswaps",JSON.stringify(S.foodSwaps));
  STORE.setItem("nos_week",S.week);STORE.setItem("nos_active_week",S.activeWeek);STORE.setItem("nos_theme",S.theme.id);

function suplKey(s,x){return S.week+"_"+s.id+"_supl_"+x.name}
function skipKey(s,x){return S.week+"_"+s.id+"_skip_supl_"+x.name}
// ── NEW: food skip key ──

function isCalciumFoodName(n){return n.includes("Eidam")||n.includes("Lípánek")}
function isMeatFoodName(n){return n.includes("Maso/rýže")||n.includes("Maso / Rýže")}
function touchesEmptySupl(s){return s.supls.some(x=>x.name==="Mg+B6"||x.name==="Taurin")}
function codexTargetFor(s){
  if(s.label.includes("Maso / Rýže"))return s.supls.some(x=>x.name==="Ca+Mg+Zn")?"meat-zinc":"fast-track";
  if(s.label.includes("Sýr")||s.label.includes("Lípánek"))return"cheese-lock";
  if(s.supls.some(x=>x.name==="Taurin"))return"taurine";
  if(s.supls.some(x=>x.name==="Ca+Mg+Zn"))return"meat-zinc";
  if(s.supls.some(x=>x.name==="D3+K2"))return"cheese-lock";
  if(s.type==="branch")return"lipanek";
  if(S.week==="A")return"double-shot";
  return"calcium-zinc";
}
function openCodex(target){S.tab="codex";S.codexTarget=target;render()}

function tryLog(s, bioNow, callback){
  if(s.lockReason && bioNow < s.lockUntil){
    S.modal = {
      type: "confirm",
      title: "⚠ OCHRANNÝ ZÁMEK",
      msg: `Tento krok je momentálně blokován!\n\nDůvod: ${s.lockReason}\nZbývá: ${s.lockUntil - bioNow} min.\n\nOpravdu chcete záznam vynutit a porušit protokol?`,
      onOk: () => { callback(); S.modal = null; render(); }
    };
    render();
  } else {
    callback();
  }
}

function computeEngine(){
  const active=S.manualTime||S.now,rawNowMin=active.getHours()*60+active.getMinutes();
  
  // Inicializace kotvy pokud chybí
  let ts = STORE.getItem("nos_anchor_ts");
  let sh = STORE.getItem("nos_anchor_shift");
  if((!ts || !sh) && ["A","B","C"].includes(S.activeWeek)){
    const realNow = S.now;
    const day = realNow.getDay() || 7;
    const m = new Date(realNow); m.setHours(0,0,0,0); m.setDate(m.getDate() - day + 1);
    ts = m.getTime(); sh = S.activeWeek;
    STORE.setItem("nos_anchor_ts", ts); STORE.setItem("nos_anchor_shift", sh);
  }

  // Páteční zámek okna A_SWAP_EVE
  const isFridayA=(active.getDay()===5 && S.week==="A");

  const baseSched=JSON.parse(JSON.stringify(WEEKS[S.week].schedule)),isActiveWeek=S.week===S.activeWeek;
  
  // Páteční Volno — zobraz jen od V_SWAP_NIGHT (20:00) dál
  const isVolnoPatek=(S.week==="V" && STORE.getItem("nos_volno_patek")==="1");
  if(isVolnoPatek){
    const startIdx=baseSched.findIndex(s=>s.id==="V_SWAP_NIGHT");
    if(startIdx>0)baseSched.splice(0,startIdx);
  }
  
  if(!baseSched.length)return{slots:[],currentIdx:-1,locks:[],bioNow:rawNowMin,isActiveWeek};
  let offset=0,prev=-1;
  baseSched.forEach(s=>{
    const tStr=s.timeStart||s.time;
    const m=t2m(tStr);
    if(prev!==-1&&m<prev)offset+=1440;
    s.absBase=m+offset;
    s._hasExplicitEnd=!!s.timeEnd;
    prev=m;
  });
  baseSched.forEach((s,i)=>{
    if(s._hasExplicitEnd){
      let em=t2m(s.timeEnd);
      if(em<=s.absBase%1440)em+=1440;
      const cycleOffset=Math.floor(s.absBase/1440)*1440;
      s.endTime=em+cycleOffset;
      if(s.endTime<=s.absBase)s.endTime+=1440;
    }else{
      s.endTime=i+1<baseSched.length?baseSched[i+1].absBase:s.absBase+480;
    }
  });
  const cycleStart=baseSched[0].absBase;
  const lastSlotEnd=baseSched[baseSched.length-1].endTime||baseSched[baseSched.length-1].absBase+480;
  let bioNow=rawNowMin;
  if(bioNow<cycleStart){
    const bioNowShifted=bioNow+1440;
    if(bioNowShifted<=lastSlotEnd)bioNow=bioNowShifted;
  }
  if(!isActiveWeek){
    const out=baseSched.map(s=>Object.assign(s,{computedMin:s.absBase,dynTime:m2t(s.absBase),isComplete:false,isMissed:false,isDrifted:false,delayReason:null,lockReason:null,lockUntil:0}));
    return{slots:out,currentIdx:findCurrent(out,bioNow),locks:[],bioNow,isActiveWeek};
  }
  let lastCalcium=-Infinity,lastWhey=-Infinity,lastTaurin=-Infinity,lastMeat=-Infinity;
  baseSched.forEach(s=>{
    s.supls.forEach(x=>{const lg=S.logs[suplKey(s,x)];if(lg&&lg.time<=bioNow&&x.name==="Taurin")lastTaurin=Math.max(lastTaurin,lg.time)});
    s.foods.forEach(x=>{
      const lg=S.logs[S.week+"_"+s.id+"_food_"+x.name];if(!lg||lg.time>bioNow)return;
      const sk=S.week+"_"+s.id+"_swap_"+x.name,isSwapped=x.swappable&&S.foodSwaps[sk],eff=isSwapped?x.swapWith:x;
      if(isCalciumFoodName(eff.name))lastCalcium=Math.max(lastCalcium,lg.time);
      if(isMeatFoodName(eff.name))lastMeat=Math.max(lastMeat,lg.time);
    });
    if(s.type==="branch"){const lg=S.logs[S.week+"_"+s.id+"_branch"];if(lg&&lg.time<=bioNow){if(lg.optId==="casein")lastCalcium=Math.max(lastCalcium,lg.time);if(lg.optId==="whey")lastWhey=Math.max(lastWhey,lg.time)}}
  });
  const locks=[];
  if(lastTaurin+TAURIN_FAST_MIN>bioNow)locks.push({msg:`⏳ Trávení Taurinu... Jídlo odemčeno za ${lastTaurin+TAURIN_FAST_MIN-bioNow} min`,until:lastTaurin+TAURIN_FAST_MIN,type:"taurin"});
  if(lastCalcium+CALCIUM_LOCK_MIN>bioNow)locks.push({msg:`⏳ VÁPNÍKOVÝ ZÁMEK: Zinek/Maso uzamčeny na ${lastCalcium+CALCIUM_LOCK_MIN-bioNow} min`,until:lastCalcium+CALCIUM_LOCK_MIN,type:"calcium"});
  if(lastWhey+WHEY_LOCK_MIN>bioNow)locks.push({msg:`⏳ Trávení Whey... Maso odemčeno za ${lastWhey+WHEY_LOCK_MIN-bioNow} min`,until:lastWhey+WHEY_LOCK_MIN,type:"whey"});
  
  const out=[];
  lastCalcium=-Infinity;lastWhey=-Infinity;lastTaurin=-Infinity;lastMeat=-Infinity;
  for(const s of baseSched){
    const isWS=s.type==="work"||s.type==="sleep"||s.type==="info",isBranch=s.type==="branch";
    // Páteční zámek okna A_SWAP_EVE
    s.fridayLocked=(isFridayA && s.id==="A_SWAP_EVE");
    const prev={calcium:lastCalcium,whey:lastWhey,taurin:lastTaurin,meat:lastMeat};
    let done=0,closed=0,maxLog=null;
    s.supls.forEach(x=>{const lk=suplKey(s,x),sk=skipKey(s,x),lg=S.logs[lk];if(lg){done++;closed++;if(!maxLog||lg.time>maxLog)maxLog=lg.time}else if(S.skips[sk])closed++});
    // ── PATCHED: food skips count toward closed ──
    s.foods.forEach(x=>{const lk=S.week+"_"+s.id+"_food_"+x.name,fsk=foodSkipKey(s,x),lg=S.logs[lk];if(lg){done++;closed++;if(!maxLog||lg.time>maxLog)maxLog=lg.time}else if(S.skips[fsk])closed++;});
    if(isBranch){const lg=S.logs[S.week+"_"+s.id+"_branch"];if(lg){done++;closed++;maxLog=lg.time}}
    const total=s.supls.length+s.foods.length+(isBranch?1:0);
    let isComplete=total>0&&closed===total;
    let minAllow=s.absBase,delayReason=null;
    
    if(s.reqAcid){
      if(prev.calcium+CALCIUM_LOCK_MIN>minAllow){minAllow=prev.calcium+CALCIUM_LOCK_MIN;delayReason="Vápníkový zámek (150 min)"}
      if(prev.whey+WHEY_LOCK_MIN>minAllow){minAllow=prev.whey+WHEY_LOCK_MIN;delayReason="Trávení Whey (45 min)"}
      if(touchesEmptySupl(s)&&prev.meat+MEAT_TO_EMPTY_SUPL_MIN>minAllow){minAllow=prev.meat+MEAT_TO_EMPTY_SUPL_MIN;delayReason="Vyprázdnění po Maso/Rýže (120 min)"}
    }
    if(s.type==="food"||s.applyCalcium){
      if(prev.taurin+TAURIN_FAST_MIN>minAllow){minAllow=prev.taurin+TAURIN_FAST_MIN;delayReason="Čeká se na doznění Taurinu nalačno"}
      if(s.applyCalcium&&prev.meat+MEAT_TO_CHEESE_MIN>minAllow){minAllow=prev.meat+MEAT_TO_CHEESE_MIN;delayReason="Fast-track odstup po Maso/Rýže (90 min)"}
    }
    
    s.lockUntil = minAllow;
    s.lockReason = delayReason;
    
    if(isWS){
      s.computedMin=s.absBase;s.isComplete=false;s.isMissed=false;s.delayReason=null;
    }
    else if(isComplete&&maxLog!==null){
      s.computedMin=maxLog;s.isComplete=true;s.isMissed=false;s.delayReason=null;
    }
    else if(isComplete){
      s.computedMin=s.absBase;s.isComplete=true;s.isMissed=false;s.delayReason=null;
    }
    else if(!isComplete&&bioNow>=s.endTime){
      s.computedMin=s.absBase;
      s.isComplete=false;
      s.isMissed=true;
      s.delayReason=minAllow>bioNow?delayReason:null;
    }
    else{
      s.computedMin=bioNow<s.absBase?Math.max(minAllow,s.absBase):Math.max(minAllow,bioNow,s.absBase);
      s.isComplete=false;
      s.isMissed=false;
      s.delayReason=minAllow>s.absBase&&minAllow>=bioNow?delayReason:null;
    }
    s.dynTime=m2t(s.computedMin);
    s.isDrifted = !s.isMissed && !isWS && s.computedMin - s.absBase > 4;
    s.doneCount=done;s.closedCount=closed;s.totalCount=total;out.push(s);
    s.supls.forEach(x=>{const lg=S.logs[suplKey(s,x)];if(lg&&x.name==="Taurin")lastTaurin=Math.max(lastTaurin,lg.time)});
    s.foods.forEach(x=>{
      const lg=S.logs[S.week+"_"+s.id+"_food_"+x.name];if(!lg)return;
      const sk=S.week+"_"+s.id+"_swap_"+x.name,isSwapped=x.swappable&&S.foodSwaps[sk],eff=isSwapped?x.swapWith:x;
      if(isCalciumFoodName(eff.name))lastCalcium=Math.max(lastCalcium,lg.time);
      if(isMeatFoodName(eff.name))lastMeat=Math.max(lastMeat,lg.time);
    });
    if(s.type==="branch"){const lg=S.logs[S.week+"_"+s.id+"_branch"];if(lg){if(lg.optId==="casein")lastCalcium=Math.max(lastCalcium,lg.time);if(lg.optId==="whey")lastWhey=Math.max(lastWhey,lg.time)}}
  }
  return{slots:out,currentIdx:findCurrent(out,bioNow),locks,bioNow,isActiveWeek};
}

    const info=div("","📋 Readonly — "+WEEK_LABELS[yweek]+" · "+yesterdayDate);

    yWrap.appendChild(info);
    ysched.forEach(s=>{
      const node=div("day-node");node.appendChild(div("day-node-dot"));
      const win=div("zion-day-window");
      const time=div("day-node-time",s.timeStart||s.time||"");time.style.color="#64748b";
      win.appendChild(time);
      win.appendChild(div("day-node-label",s.label));
      const suplDone=s.supls.length>0&&s.supls.every(x=>yd.logs[yweek+"_"+s.id+"_supl_"+x.name]);
      const foodDone=s.foods.length>0&&s.foods.every(x=>yd.logs[yweek+"_"+s.id+"_food_"+x.name]);
      const hasTasks=s.supls.length>0||s.foods.length>0;
      const done=!hasTasks?false:(s.supls.length===0?foodDone:s.foods.length===0?suplDone:suplDone&&foodDone);
      const sub=div("day-node-sub",!hasTasks?"INFO":done?"✓ HOTOVO":"✗ NESPLNĚNO");
      sub.style.color=done?"#22c55e":"#64748b";
      win.appendChild(sub);node.appendChild(win);yWrap.appendChild(node);
    });
    content.appendChild(yWrap);return;
  }
  const wrap=div("");wrap.id="day-wrap";wrap.style.cssText="position:relative;padding-left:0;padding-top:6px;padding-bottom:40px";
  wrap.appendChild(div("day-track"));wrap.appendChild(div("day-track-ideal"));
  const liveDot=div("day-live-dot");liveDot.id="day-live-dot";wrap.appendChild(liveDot);

  slots.forEach((s,idx)=>{
    const node=div("day-node"+(s.isComplete?" done":"")+(idx===currentIdx?" active":""));
    node.style.marginTop=idx===0?"0":"14px";
    node.appendChild(div("day-node-dot"));node.appendChild(div("day-tick"));
    const win=div("zion-day-window");
    const isInfoTypeD=s.type==="info"||s.type==="work"||s.type==="sleep";
    const dayTimeLabel=isInfoTypeD&&s.timeStart&&s.timeEnd ? s.timeStart : s.dynTime;
    const time=div("day-node-time",dayTimeLabel);
    time.style.color=s.isMissed?"#ef4444":idx===currentIdx?"var(--accent)":s.isComplete?"#f3f4f6":"#94a3b8";
    win.appendChild(time);
    const isTargetType=s.type==="food"||s.type==="supl"||s.type==="branch"||s.type==="swap";
    const diff=s.computedMin-s.absBase;
    
    const origTime = s.timeStart || s.time;
    if((s.dynTime!==origTime)||(isTargetType&&s.isComplete&&diff!==0)){
      const ir=div("day-node-sub");ir.style.cssText="display:flex;gap:10px;margin-top:4px;margin-bottom:8px";
      if(s.dynTime!==origTime){const e=div("","Ideál: "+origTime);e.style.marginTop="0";ir.appendChild(e)}
      if(isTargetType&&s.isComplete&&diff!==0){const e=div("","Odchylka: "+signedMin(diff));e.style.cssText="margin-top:0;color:#f97316";ir.appendChild(e)}
      win.appendChild(ir);
    }
    
    win.appendChild(div("day-node-label",s.label));
    const cycleStartMin=slots.length>0?slots[0].absBase:0;
    const isNextDay=s.endTime<cycleStartMin;
    const isCurD=idx===currentIdx;
    const isPastInfoD=(s.type==="info"||s.type==="work"||s.type==="sleep")&&!isCurD&&bioNow>(s.endTime||s.absBase+60);
    let status=(s.type==="work"||s.type==="sleep")?(isCurD?"▶ PROBÍHÁ":isPastInfoD?"✓ HOTOVO":"INFO"):s.type==="info"?(isCurD?"▶ PROBÍHÁ":isPastInfoD?"✓":"INFO"):s.isComplete?"✓ HOTOVO":s.isMissed?(isNextDay?"⚠ VČERA":"✗ MISSED"):isCurD?"▶ TEĎ":"ČEKÁ";
    const sub=div("day-node-sub",status);
    sub.style.color=s.isComplete?"#22c55e":s.isMissed?(isNextDay?"#64748b":"#ef4444"):isPastInfoD?"#374151":isCurD?"var(--accent)":"#64748b";
    win.appendChild(sub);node.appendChild(win);wrap.appendChild(node);
  });
  content.appendChild(wrap);

  requestAnimationFrame(()=>{
    const w=document.getElementById("day-wrap");const dot=document.getElementById("day-live-dot");
    if(!w||!dot)return;
    dot.style.transition="none";
    const nodes=w.querySelectorAll(".day-node");
    if(currentIdx>=0&&currentIdx<nodes.length){
      const node=nodes[currentIdx],s=slots[currentIdx];
      const progress=Math.max(0,Math.min(1,(bioNow-s.absBase)/(s.endTime-s.absBase)));
      dot.style.top=(node.offsetTop+node.offsetHeight*progress)+"px";
    }else if(currentIdx>=nodes.length){dot.style.top="100%"}else{dot.style.top="0px"}
    requestAnimationFrame(()=>{dot.style.transition="top .4s ease"});
  });
}
